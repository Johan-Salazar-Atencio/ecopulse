# Puerto del servidor
server.port=${PORT:8080}

# MongoDB Atlas - Connection String via variable de entorno.
# NUNCA pongas tu password real en este archivo.
# Configura la variable MONGODB_URI en Render (o en tu .env local).
# Formato: mongodb+srv://USUARIO:PASSWORD@CLUSTER.mongodb.net/ecopulse?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecopulse}

# Logs amigables
spring.output.ansi.enabled=always

# Jackson: serializar timestamps como ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false
